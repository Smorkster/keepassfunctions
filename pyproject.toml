[project]
name = "keepassfunctions"
version = "2.1.0"
description = "Context-managed KeePass wrapper for credential lookup and AutoType execution"
keywords = ["keepass", "pykeepass", "autotype", "automation", "credentials"]
authors = [{ name="Smorkster", email="smorkster@gmail.com" }]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "dynamicinputbox>=3.0",
    "pykeepass>=4.1.1.post1",
    "pywinauto>=0.6.9"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows"
]

[project.optional-dependencies]
dev = ["build", "twine"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/Smorkster/keepassfunctions"
Repository = "https://github.com/Smorkster/keepassfunctions"
Issues = "https://github.com/Smorkster/keepassfunctions/issues"

